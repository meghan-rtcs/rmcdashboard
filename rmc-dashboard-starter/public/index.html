                 </div> : null}
              </div>
              </fieldset>
              {err ? <p style={{ color: C.red, fontSize: 12, marginTop: 10 }}>{err}</p> : null}
              <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 14 }}>
                <button onClick={onClose} style={{ background: C.bg, border: "1px solid " + C.border, borderRadius: 8, padding: "8px 16px", fontSize: 13, color: C.muted }}>Cancel</button>
                <button onClick={save} disabled={saving || !ownerAuthorized} style={{ background: C.gold, color: "#fff", border: "none", borderRadius: 8, padding: "8px 18px", fontWeight: 600, fontSize: 13, opacity: saving || !ownerAuthorized ? 0.6 : 1 }}>{saving ? "Saving…" : "Save Configuration"}</button>
              </div>
            </div>
          )}
        </Modal>
      );
    }

    function TeamTab({ refreshKey, propertyGroup, ownerAuthorized, onOwnerExpired, onConfigSaved }) {
      const [quarter, setQuarter] = useState(null); // null = current
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [drill, setDrill] = useState(null);
      const [drillData, setDrillData] = useState(null);
      const [showConfig, setShowConfig] = useState(false);
      const [snapping, setSnapping] = useState(false);
      const [snapshotError, setSnapshotError] = useState(null);
      const [openEmp, setOpenEmp] = useState(null);
      const [retroactive, setRetroactive] = useState(false);

      const load = (q) => {
        if (ownerAuthorized === false && !data) {
          setLoading(false);
          setError(OWNER_SIGN_IN_MESSAGE);
          return;
        }
        setLoading(true);
        const params = new URLSearchParams({ propertyGroup });
        if (q) params.set("quarter", q);
        if (retroactive) params.set("retroactive", "1");
        fetch("/api/team?" + params.toString())
          .then(async (r) => { if (!r.ok) throw await saveError(r, "Could not load team performance."); return r.json(); })
          .then((j) => { setData(j); setError(null); })
          .catch((e) => { if (e.authorization) onOwnerExpired(); setError(e.message); })
          .finally(() => setLoading(false));
      };
      useEffect(() => load(quarter), [quarter, retroactive, propertyGroup, refreshKey, ownerAuthorized]);

      const openDrill = (key) => {
        setDrill(key); setDrillData(null);
        fetch("/api/team/drilldown/" + encodeURIComponent(key) + "?quarter=" + encodeURIComponent(data.quarter) + "&propertyGroup=" + encodeURIComponent(propertyGroup))
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(setDrillData)
          .catch(() => setDrillData({ title: "Could not load records", cols: [], rows: [] }));
      };

      const snapshot = async () => {
        if (!ownerAuthorized) {
          setSnapshotError(OWNER_SIGN_IN_MESSAGE);
          return;
        }
        if (!window.confirm("Snapshot " + data.quarter + "? This locks the numbers shown for this quarter (an existing snapshot will be replaced with a new timestamp).")) return;
        setSnapping(true); setSnapshotError(null);
        try {
          const response = await fetch("/api/team/snapshot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ quarter: data.quarter, replaceExisting: !!data.snapshot?.locked }) });
          if (!response.ok) throw await saveError(response, "The quarter snapshot was not saved.");
          await response.json();
          load(quarter);
        } catch (e) {
          if (e.authorization) onOwnerExpired();
          setSnapshotError(e.message);
        } finally {
          setSnapping(false);
        }
      };

      if (loading) return <div style={{ padding: 80, textAlign: "center", color: C.muted }}>Loading team performance…</div>;
      if (error || !data) return <div style={{ marginTop: 24, padding: 18, background: C.card, border: "1px solid " + C.border, borderLeft: "4px solid " + C.red, borderRadius: 10 }}><p style={{ color: C.red, fontSize: 13 }}>{error || "No data"}</p><a href="/owner-login.html" style={{color:C.black,fontSize:13}}>Set up or sign in to owner access</a></div>;

      const totalEarned = data.employees.reduce((s, e) => s + e.earned, 0);
      const totalMax = data.employees.reduce((s, e) => s + e.max, 0);

      return (
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, margin: "18px 0 6px" }}>
            <div style={{ display: "inline-flex", background: C.bg, border: "1px solid " + C.border, borderRadius: 8, padding: 2, flexWrap: "wrap" }}>
              {data.quarters.map((q) => (
                <button key={q} onClick={() => setQuarter(q)}
                  style={{ background: data.quarter === q ? C.gold : "transparent", color: data.quarter === q ? "#fff" : C.muted, border: "none", borderRadius: 6, padding: "5px 11px", fontSize: 12, fontWeight: data.quarter === q ? 600 : 500, cursor: "pointer" }}>{q}</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setShowConfig(true)} disabled={!ownerAuthorized} title={!ownerAuthorized ? OWNER_SIGN_IN_MESSAGE : ""} style={{ background: "#fff", border: "1px solid " + C.border, borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 600, color: C.muted, opacity: ownerAuthorized ? 1 : 0.6 }}>⚙ Configure KPIs</button>
              <button onClick={snapshot} disabled={snapping || !ownerAuthorized} title={!ownerAuthorized ? OWNER_SIGN_IN_MESSAGE : ""} style={{ background: C.black, color: "#fff", border: "none", borderRadius: 8, padding: "7px 14px", fontSize: 12, fontWeight: 600, opacity: snapping || !ownerAuthorized ? 0.6 : 1 }}>{snapping ? "Locking…" : data.snapshot && data.snapshot.locked ? "Re-snapshot Quarter" : "Snapshot & Lock Quarter"}</button>
            </div>
          </div>
          {!ownerAuthorized ? <div style={{ marginBottom: 8, padding: "9px 12px", border: "1px solid rgba(216,146,26,0.35)", borderRadius: 8, color: C.amber, fontSize: 12 }}>{OWNER_SIGN_IN_MESSAGE} <a href="/owner-login.html" style={{ color: C.black }}>Owner sign in</a></div> : null}
          {snapshotError ? <div style={{ marginBottom: 8, padding: "9px 12px", border: "1px solid rgba(192,57,43,0.35)", borderRadius: 8, color: C.red, fontSize: 12 }}>{snapshotError}</div> : null}
          {data.snapshot?.locked && !data.isCurrent ? <label style={{display:"block",margin:"2px 0 9px",fontSize:11.5,color:C.muted}}><input type="checkbox" checked={retroactive} onChange={e=>setRetroactive(e.target.checked)} /> Retroactively score captured values using current thresholds (does not change locked payouts)</label> : null}

          {data.snapshot && data.snapshot.locked ? (
            <div style={{ background: "rgba(45,140,62,0.07)", border: "1px solid rgba(45,140,62,0.3)", borderRadius: 9, padding: "9px 14px", fontSize: 12, color: C.green, marginBottom: 8 }}>
              {data.retroactive ? "↻ RETROACTIVE MODE — captured historical values are re-scored under current thresholds; locked payouts are unchanged." : "🔒 Locked snapshot taken " + new Date(data.snapshot.at).toLocaleString() + " — original locked payouts are preserved."}
            </div>
          ) : data.notLocked ? (
            <div style={{ background: "rgba(216,146,26,0.07)", border: "1px solid rgba(216,146,26,0.35)", borderRadius: 9, padding: "9px 14px", fontSize: 12, color: C.amber, marginBottom: 8 }}>
              ⚠ This past quarter has never been snapshotted — numbers shown are computed live from current data and may differ from what was true at quarter end. Use "Snapshot & Lock Quarter" to freeze them.
            </div>
          ) : data.snapshot ? (
            <div style={{ background: C.bg, border: "1px solid " + C.border, borderRadius: 9, padding: "9px 14px", fontSize: 12, color: C.muted, marginBottom: 8 }}>
              Current quarter — showing live numbers (a snapshot from {new Date(data.snapshot.at).toLocaleString()} exists and will be used once the quarter closes).
            </div>
          ) : null}

          {data.sheetSync ? (
            <div style={{ background: data.sheetSync.ok ? C.bg : "rgba(176,42,42,0.07)", border: "1px solid " + (data.sheetSync.ok ? C.border : "rgba(176,42,42,0.35)"), borderRadius: 9, padding: "9px 14px", fontSize: 12, color: data.sheetSync.ok ? C.muted : C.red, marginBottom: 8, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              {data.sheetSync.ok ? (
                <span>📋 Other billable hours sheet synced {new Date(data.sheetSync.at).toLocaleString()}
                  {data.sheetSync.quarterHours ? " — this quarter: " + fmt.num(data.sheetSync.quarterHours.approved) + "h approved (counted)" + (data.sheetSync.quarterHours.pending ? ", " + fmt.num(data.sheetSync.quarterHours.pending) + "h pending approval (not counted)" : "") : ""}</span>
              ) : (
                <span>⚠ Google Sheet sync FAILED{data.sheetSync.failedAt ? " " + new Date(data.sheetSync.failedAt).toLocaleString() : ""} ({data.sheetSync.error}) — utilization uses the last successful sheet read{data.sheetSync.at ? " from " + new Date(data.sheetSync.at).toLocaleString() : ""}.</span>
              )}
              <button onClick={() => openDrill("team_sheet_hours")} style={{ background: "#fff", border: "1px solid " + C.border, borderRadius: 6, padding: "3px 10px", fontSize: 11.5, fontWeight: 600, color: C.muted, cursor: "pointer" }}>Audit entries</button>
            </div>
          ) : null}

          <div style={gridAuto(200)}>
            <KpiCard label="Quarterly Incentive Earned" value={fmt.money(totalEarned)} tone="good" sub={data.quarter} big />
            <KpiCard label="Quarterly Possible" value={fmt.money(totalMax)} sub="Evenly split across up to 4 weighted KPIs" big />
            <KpiCard label="Quarter Window" value={data.quarterStart.slice(5) + " → " + data.quarterEnd.slice(5)} sub={data.isCurrent ? "In progress — metrics reflect quarter-to-date" : "Closed"} big />
          </div>

          {data.departments.map((d) => (
            <div key={d.department}>
              <SectionHeader title={d.department}
                subtitle={(d.members.length ? "Shared department result: " + d.members.map((m) => m.name.split(" ")[0]).join(" · ") : "No assigned members") + " · Each employee’s eligible results are weighted evenly"} />
              <div style={{ background: C.card, border: "1px solid " + C.border, borderRadius: 10, overflow: "hidden" }}>
                {d.kpis.map((k) => <KpiRow key={k.id} k={k} onDrill={openDrill} />)}
                {d.individualKpis.length ? (
                  <div style={{ padding: "7px 16px 3px", fontSize: 9.5, fontWeight: 800, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em", background: "#FAF7F0", borderBottom: "1px solid " + C.grid }}>Individual KPIs (not pooled)</div>
                ) : null}
                {d.individualKpis.map((k) => <KpiRow key={k.id} k={k} onDrill={openDrill} />)}
              </div>
            </div>
          ))}

          <SectionHeader title="Bonuses by Employee" subtitle={"Each employee’s quarterly " + fmt.money(data.settings?.quarterlyIncentive) + " incentive is split evenly across no more than four weighted KPI results · click a row for details"} />
          <div style={{ background: C.card, border: "1px solid " + C.border, borderRadius: 10, overflow: "hidden" }}>
            {data.employees.map((e) => (
              <div key={e.id}>
                <div onClick={() => setOpenEmp(openEmp === e.id ? null : e.id)}
                  style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 16px", borderBottom: "1px solid " + C.grid, cursor: "pointer" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: C.black }}>{e.name}</div>
                    <div style={{ fontSize: 10.5, color: C.muted }}>{e.role + " · " + e.weightedKpiCount + " weighted KPI" + (e.weightedKpiCount === 1 ? "" : "s") + " · YTD " + fmt.money(e.ytdEarned) + " of " + fmt.money(e.ytdPossible)}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 17, fontWeight: 600, color: e.earned ? C.green : C.muted, fontVariantNumeric: "tabular-nums" }}>{fmt.money(e.earned)}</div>
                    <div style={{ fontSize: 9.5, color: "#B8AF9C" }}>of {fmt.money(e.max)} max</div>
                  </div>
                  <span style={{ fontSize: 12, color: "#CFC6B2", transform: openEmp === e.id ? "rotate(90deg)" : "none", transition: "transform .15s" }}>›</span>
                </div>
                {openEmp === e.id ? (
                  <div style={{ background: "#FCFAF6", borderBottom: "1px solid " + C.grid, padding: "6px 16px 10px" }}>
                    {e.breakdown.length === 0 ? <div style={{ fontSize: 11.5, color: C.muted, padding: "6px 0" }}>No KPIs apply to this employee yet.</div> :
                      e.breakdown.map((b, i) => (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 11.5, padding: "4px 0", color: C.muted }}>
                           <span style={{ flex: 1 }}>{b.kpi} <span style={{ color: "#B8AF9C" }}>({b.type === "individual" ? "individual" : b.department})</span></span>
                          <TierBadge tier={b.tier} configured={b.tier != null} active={true} />
                          <span style={{ width: 90, textAlign: "right", fontWeight: 600, color: b.payout ? C.green : C.muted, fontVariantNumeric: "tabular-nums" }}>{fmt.money(b.payout)}</span>
                        </div>
                      ))}
                    {e.expectations?.length ? <div style={{fontSize:11,color:C.muted,paddingTop:7}}>Unweighted expectations: {e.expectations.map(x => x.kpi).join(" · ")}</div> : null}
                    <div style={{fontSize:11.5,color:e.stretch?.eligible ? C.green : C.muted,paddingTop:8}}>Year-end stretch {e.stretch?.eligible ? fmt.money(e.stretch.amount) + " eligible" : e.stretch?.status + " — " + e.stretch?.reason}{e.stretch?.bestRatio != null ? " (" + e.stretch.bestRatio + "% Best)" : ""}</div>
                  </div>
                ) : null}
              </div>
            ))}
          </div>

          {drill ? (
            <Modal title={drillData ? drillData.title : "Loading…"} onClose={() => { setDrill(null); setDrillData(null); }}>
              {!drillData ? <div style={{ padding: 48, textAlign: "center", color: C.muted, fontSize: 13 }}>Loading records…</div> : <DrillTable drill={drillData} />}
            </Modal>
          ) : null}
          {showConfig ? <KpiConfigModal quarter={data.quarter} ownerAuthorized={ownerAuthorized} onOwnerExpired={onOwnerExpired} onClose={() => setShowConfig(false)} onSaved={() => { setShowConfig(false); load(quarter); onConfigSaved(); }} /> : null}
        </div>
      );
    }

    function OwnerScorecard({ ownerAuthorized, onOwnerExpired }) {
      const [cfg, setCfg] = useState(null);
      const [data, setData] = useState(null);
      const [employee, setEmployee] = useState("");
      const [answers, setAnswers] = useState([]);
      const [retiredAdjustments, setRetiredAdjustments] = useState([]);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState(null);
      const [year, setYear] = useState(String(new Date().getFullYear()));
      const [reviewQuarter, setReviewQuarter] = useState("Q4");
      const quarter = year + "-" + reviewQuarter;
      const clearSensitiveState = () => {
        setCfg(null); setData(null); setEmployee(""); setAnswers([]); setRetiredAdjustments([]);
      };
      const load = async (isCurrent = () => true) => {
        if (!ownerAuthorized) {
          if (isCurrent()) clearSensitiveState();
          return;
        }
        setError(null);
        const readProtected = async (url, message) => {
          const response = await fetch(url);
          if (response.ok) return response.json();
          if (response.status === 401 || response.status === 403) throw await saveError(response, message);
          let detail = "";
          try { detail = (await response.json()).error || ""; } catch {}
          throw new Error(response.status >= 500 ? message + " Please try again." : detail || message);
        };
        try {
          const [c, d, h] = await Promise.all([
            readProtected("/api/team/config", "Could not load Owner configuration."),
            readProtected("/api/owner/scorecard?quarter=" + quarter, "Could not load the Owner scorecard."),
            readProtected("/api/owner/historical-adjustments", "Could not load historical adjustment annotations."),
          ]);
          if (!isCurrent()) return;
          setCfg(c); setData(d); setEmployee(d.roster[0]?.id || ""); setRetiredAdjustments(h.adjustments || []);
        } catch (e) {
          if (!isCurrent()) return;
          if (e.authorization) {
            clearSensitiveState();
            onOwnerExpired();
          }
          setError(e.message);
        }
      };
      useEffect(() => {
        let current = true;
        if (!ownerAuthorized) {
          clearSensitiveState();
          setError(null);
        } else {
          load(() => current);
        }
        return () => { current = false; };
      }, [ownerAuthorized, year, reviewQuarter]);
      useEffect(() => {
        if (!data || !employee) return;
        const review = data.reviews.find(r => r.employee_id === employee);
        setAnswers(review?.answers || Array((cfg?.settings?.discretionary_questions || []).length).fill("na"));
      }, [employee, data, cfg]);
      if (ownerAuthorized === null) return <div style={{padding:50,textAlign:"center",color:C.muted}}>Checking owner access…</div>;
      if (!ownerAuthorized) return <div style={{maxWidth:520,margin:"55px auto",padding:24,background:C.card,border:"1px solid "+C.border,borderRadius:12}}>
        <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>Owner-only bonus scorecard</div><p style={{fontSize:13,color:C.muted,lineHeight:1.5}}>Discretionary questions and scores are not included in team or public APIs. Sign in with the separate owner session to view or edit them.</p>
        <a href="/owner-login.html" style={{display:"inline-block",marginTop:14,background:C.black,color:"#fff",padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:600,textDecoration:"none"}}>Owner sign in</a>
      </div>;
      if (!cfg || !data) return <div style={{padding:30,color:error ? C.red : C.muted}}>{error || "Loading owner scorecard…"}</div>;
      const emp = data.roster.find(e => e.id === employee);
      const questions = cfg.settings.discretionary_questions || [];
      const scored = answers.filter(a => a !== "na").map(Number);
      const max = Number(cfg.settings.discretionary_max_by_role?.[emp?.role] || 4000);
      const bonus = scored.length ? Math.round((scored.reduce((s,a)=>s+a,0) / (scored.length * 2)) * max) : 0;
      const save = async () => { if (!ownerAuthorized) { setError(OWNER_SIGN_IN_MESSAGE); return; } setSaving(true); setError(null); try {
        const r = await fetch("/api/owner/scorecard",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({quarter,employee_id:employee,answers})});
        if (!r.ok) throw await saveError(r, "The Owner scorecard was not saved.");
        await load();
      } catch(e){if(e.authorization){clearSensitiveState();onOwnerExpired()}setError(e.message)} finally {setSaving(false)} };
      return <div>
        <SectionHeader title="Owner-only discretionary scorecard" subtitle="0 / 1 / 2 / N/A · not visible to the team" />
        {retiredAdjustments.length ? <div style={{marginBottom:12,padding:"10px 12px",borderRadius:8,background:"#FFF7E6",color:C.brown,fontSize:12}}>Historical retired-share annotation: {retiredAdjustments.map(a=>a.quarter+" "+fmt.money(a.amount)+" — "+a.note).join(" · ")}</div> : null}
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",marginBottom:14}}>
          <label style={{fontSize:12,color:C.muted}}>Scorecard <select disabled={saving} value={year} onChange={e=>setYear(e.target.value)} style={{marginLeft:5,padding:"5px 8px",border:"1px solid "+C.border,borderRadius:6}}>{Array.from({length:5},(_,i)=>new Date().getFullYear()-2+i).map(y=><option key={y} value={y}>{y}</option>)}</select> <select disabled={saving} value={reviewQuarter} onChange={e=>setReviewQuarter(e.target.value)} style={{marginLeft:5,padding:"5px 8px",border:"1px solid "+C.border,borderRadius:6}}><option value="Q3">Q3 — September</option><option value="Q4">Q4 — year-end</option></select></label>
          <select disabled={saving} value={employee} onChange={e=>setEmployee(e.target.value)} style={{padding:"7px 9px",border:"1px solid "+C.border,borderRadius:7,background:"#fff"}}>{data.roster.map(e=><option key={e.id} value={e.id}>{e.name} — {e.role}</option>)}</select>
          <span style={{fontSize:12,color:C.green,fontWeight:700}}>Score-based discretionary guide: {fmt.money(bonus)} of {fmt.money(max)}</span>
        </div>
        <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,overflow:"hidden"}}>
          {questions.map((q,i)=><div key={i} style={{padding:"12px 15px",borderBottom:"1px solid "+C.grid,display:"flex",gap:12,alignItems:"center",justifyContent:"space-between",flexWrap:"wrap"}}>
            <span style={{fontSize:13}}>{i+1}. {q}</span><select disabled={saving} value={answers[i] ?? "na"} onChange={e=>setAnswers(a=>a.map((x,n)=>n===i?(e.target.value==="na"?"na":Number(e.target.value)):x))} style={{padding:"5px 8px",border:"1px solid "+C.border,borderRadius:6}}><option value="na">N/A</option><option value="0">0</option><option value="1">1</option><option value="2">2</option></select>
          </div>)}
        </div>
        {error ? <p style={{color:C.red,fontSize:12,marginTop:8}}>{error}</p> : null}
        <button onClick={save} disabled={saving || !ownerAuthorized} style={{marginTop:14,background:C.gold,color:"#fff",border:0,borderRadius:8,padding:"8px 16px",fontWeight:600}}>{saving?"Saving…":"Save owner scorecard"}</button>
      </div>;
    }

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [tab, setTab] = useState("dashboard");
      const [range, setRange] = useState("this_month");
      const [propertyGroup, setPropertyGroup] = useState("configured");
      const [propertyGroups, setPropertyGroups] = useState([]);
      const [syncing, setSyncing] = useState(false);
      const [teamRefresh, setTeamRefresh] = useState(0);
      const [activeDrill, setActiveDrill] = useState(null);
      const [drillData, setDrillData] = useState(null);
      const [drillLoading, setDrillLoading] = useState(false);
      const [ownerAuthorized, setOwnerAuthorized] = useState(null);

      const checkOwnerSession = () => {
        fetch("/api/owner/session")
          .then((r) => r.ok ? r.json() : { owner: false })
          .then((j) => setOwnerAuthorized(j.owner === true))
          .catch(() => setOwnerAuthorized(false));
      };
      useEffect(() => {
        checkOwnerSession();
        const timer = window.setInterval(checkOwnerSession, 60000);
        window.addEventListener("focus", checkOwnerSession);
        return () => {
          window.clearInterval(timer);
          window.removeEventListener("focus", checkOwnerSession);
        };
      }, []);

      const load = () => {
        setLoading(true);
        fetch("/api/dashboard?range=" + encodeURIComponent(range) + "&propertyGroup=" + encodeURIComponent(propertyGroup))
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then((j) => { setData(j); setError(null); })
          .catch((e) => setError(e.message))
          .finally(() => setLoading(false));
      };
      useEffect(load, [range, propertyGroup]);
      const refreshPropertyGroups = () => fetch("/api/property-groups")
        .then(r => { if (!r.ok) throw new Error("Could not refresh property-group labels. Please reload the page."); return r.json(); })
        .then(j => setPropertyGroups(j.groups || []))
        .catch(e => setError(e.message));
      useEffect(() => { refreshPropertyGroups(); }, []);

      const sync = () => {
        setSyncing(true);
        fetch("/api/sync", { method: "POST" })
          .then((r) => r.json())
          .then(() => { setTeamRefresh(n => n + 1); fetch("/api/property-groups").then(r => r.ok ? r.json() : {groups:[]}).then(j => setPropertyGroups(j.groups || [])); load(); })
          .catch((e) => setError(e.message))
          .finally(() => setSyncing(false));
      };

      const syncedAt = data?.dashboard?.meta?.syncedAt;
      const tabs = [
        { id: "dashboard", label: "Dashboard" },
        { id: "leasing", label: "Leasing & Marketing" },
        { id: "operations", label: "Operations" },
        { id: "team", label: "Team Performance" },
        { id: "ceo", label: "CEO View" },
        { id: "owner", label: "Owner Bonus" },
      ];
      const rangeOptions = [
        { id: "this_month", label: "This Mo", full: "This month" },
        { id: "last_month", label: "Last Mo", full: "Last month" },
        { id: "this_quarter", label: "This Qtr", full: "This quarter" },
        { id: "last_quarter", label: "Last Qtr", full: "Last quarter" },
        { id: "this_year", label: "This Yr", full: "This year" },
        { id: "last_year", label: "Last Yr", full: "Last year" },
      ];
      const rangeLabel = (rangeOptions.find((r) => r.id === range) || {}).full || "This month";

      const openDrill = (key) => {
        setActiveDrill(key);
        setDrillData(null);
        setDrillLoading(true);
        fetch("/api/drilldown/" + encodeURIComponent(key) + "?range=" + encodeURIComponent(range) + "&propertyGroup=" + encodeURIComponent(propertyGroup))
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then((j) => setDrillData(j))
          .catch(() => setDrillData({ title: "Could not load records", cols: [], rows: [] }))
          .finally(() => setDrillLoading(false));
      };
      const closeDrill = () => { setActiveDrill(null); setDrillData(null); };

      return (
        <DrillContext.Provider value={{ open: openDrill }}>
          <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
            <header style={{ background: "#fff", borderBottom: "1px solid " + C.border, padding: "12px 26px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12, position: "sticky", top: 0, zIndex: 40 }}>
              <img src="/logo.png" alt="Real Management Company" style={{ height: 54, width: "auto", display: "block" }} />
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5, color: C.muted }}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: syncedAt ? C.green : "#CFC6B2" }} />
                  {syncedAt ? "Synced " + new Date(syncedAt).toLocaleString() : "Not synced yet"}
                </span>
                <button onClick={sync} disabled={syncing}
                  style={{ background: C.gold, color: "#fff", border: "none", borderRadius: 8, padding: "8px 16px", fontWeight: 600, fontSize: 13, opacity: syncing ? 0.6 : 1, display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ display: "inline-block", transform: syncing ? "rotate(360deg)" : "none", transition: "transform 1.2s linear" }}>↻</span>
                  {syncing ? "Syncing…" : "Sync Now"}
                </button>
              </div>
            </header>

            <nav style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "0 26px", background: C.card, borderBottom: "1px solid " + C.border, position: "sticky", top: 0, zIndex: 30, flexWrap: "wrap" }}>
              <div style={{ display: "flex", gap: 0 }}>
                {tabs.map((t) => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    style={{ background: "none", border: "none", padding: "13px 18px", fontSize: 13, fontWeight: tab === t.id ? 600 : 500, color: tab === t.id ? C.black : C.muted, borderBottom: "2px solid " + (tab === t.id ? C.gold : "transparent"), marginBottom: -1 }}>
                    {t.label}
                  </button>
                ))}
              </div>
              <div style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "6px 0" }}>
                <span style={{ fontSize: 11, fontWeight: 600, color: C.muted, textTransform: "uppercase", letterSpacing: 0.4 }}>Activity period</span>
                <div style={{ display: "inline-flex", background: C.bg || "#F1ECE0", border: "1px solid " + C.border, borderRadius: 8, padding: 2 }}>
                  {rangeOptions.map((r) => (
                    <button key={r.id} onClick={() => setRange(r.id)} title={r.full}
                      style={{ background: range === r.id ? C.gold : "transparent", color: range === r.id ? "#fff" : C.muted, border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 12, fontWeight: range === r.id ? 600 : 500, cursor: "pointer", transition: "background 0.15s" }}>
                      {r.label}
                    </button>
                  ))}
                </div>
                <label style={{ fontSize: 11, fontWeight: 600, color: C.muted, textTransform: "uppercase", letterSpacing: .4 }}>Property group <select value={propertyGroup} onChange={e => setPropertyGroup(e.target.value)} style={{ marginLeft: 5, fontSize: 12, padding: "5px 7px", border: "1px solid " + C.border, borderRadius: 6, background: "#fff", color: C.black }}><option value="configured">Configured bonus group</option><option value="all">All properties</option>{propertyGroups.map(g => <option key={g.id} value={g.id}>{g.label}</option>)}</select></label>
              </div>
            </nav>

            <main style={{ flex: 1, padding: "4px 26px 48px", maxWidth: 1320, width: "100%", margin: "0 auto" }}>
              {loading ? (
                <div style={{ padding: 80, textAlign: "center", color: C.muted }}>Loading dashboard…</div>
              ) : error ? (
                <div style={{ marginTop: 24, background: C.card, border: "1px solid " + C.border, borderLeft: "4px solid " + C.red, borderRadius: 10, padding: 18 }}>
                  <h3 style={{ color: C.red, marginBottom: 6 }}>Could not load dashboard</h3>
                  <p style={{ color: C.muted, fontSize: 13 }}>{error}</p>
                  <button onClick={load} style={{ marginTop: 12, background: C.gold, color: "#fff", border: "none", borderRadius: 8, padding: "8px 16px", fontWeight: 600 }}>Retry</button>
                </div>
              ) : data ? (
                <>
                  {tab === "dashboard" && <DashboardTab d={data.dashboard} rangeLabel={rangeLabel} />}
                  {tab === "leasing" && <LeasingTab d={data.dashboard} rangeLabel={rangeLabel} />}
                  {tab === "operations" && <OperationsTab d={data.dashboard} rangeLabel={rangeLabel} ownerAuthorized={ownerAuthorized === true} onOwnerExpired={() => setOwnerAuthorized(false)} onDrill={openDrill} />}
                   {tab === "team" && <PasswordGate label="Team Performance"><TeamTab refreshKey={range + ":" + teamRefresh} propertyGroup={propertyGroup} ownerAuthorized={ownerAuthorized} onOwnerExpired={() => setOwnerAuthorized(false)} onConfigSaved={() => { refreshPropertyGroups(); load(); }} /></PasswordGate>}
                  {tab === "ceo" && <PasswordGate label="CEO View"><CeoTab d={data.dashboard} /></PasswordGate>}
                   {tab === "owner" && <OwnerScorecard ownerAuthorized={ownerAuthorized} onOwnerExpired={() => setOwnerAuthorized(false)} />}
                  {data.dashboard.meta.totalUnits === 0 && tab === "dashboard" ? (
                    <div style={{ marginTop: 20, background: C.card, border: "1px solid " + C.border, borderLeft: "4px solid " + C.amber, borderRadius: 10, padding: 18 }}>
                      <p style={{ fontSize: 13, color: C.muted }}>No data yet. Make sure AppFolio credentials are set, then click <b>Sync Now</b>.</p>
                    </div>
                  ) : null}
                </>
              ) : null}
            </main>

            {activeDrill ? (
              <Modal title={drillData ? drillData.title : "Loading…"} onClose={closeDrill}>
                {drillLoading ? (
                  <div style={{ padding: 48, textAlign: "center", color: C.muted, fontSize: 13 }}>Loading records…</div>
                ) : (
                  <DrillTable drill={drillData} />
                )}
              </Modal>
            ) : null}
          </div>
        </DrillContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
